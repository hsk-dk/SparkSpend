#
# 3. On the SparkSpend server: run `php migrate.php` (creates the table device_energy), make sure
#    /receive_device_energy.php is excluded from the Authentik proxy like receive_charger_event.php,
#    and load the winter 2025/26 history once (see varme_skur_backfill.json in this folder):
#
#      curl -X POST https://<your-sparkspend-host>/receive_device_energy.php \
#           -H "Authorization: Bearer $VEHICLE_API_KEY" -H "Content-Type: application/json" \
#           --data @varme_skur_backfill.json
#
#    Answer: {"success":true,"message":"Stored","rows":94}
#
# More devices later: add them to `devices` in the payload ({'fryser': ..., 'tv_stue': ...}). Keys are
# lower-case letters, digits and underscores; SparkSpend stores any of them.
