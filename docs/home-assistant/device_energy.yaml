# Home Assistant -> SparkSpend: daily energy per device (first device: the shed heater, "Varme - Skur").
#
# SparkSpend shows it inside "Restforbrug" as "heraf Varme - Skur" (Hus > Forbrug and Hus > Regning).
# The house meter cannot tell what is behind it; the sub-meter in the shed can.
#
# THREE parts to install:
#
# 1. configuration.yaml  (then Developer tools > YAML > Check, and reload / restart)
#    The same Authorization header as the rest_commands you already use for SparkSpend.
#
rest_command:
  sparkspend_device_energy:
    url: "https://<your-sparkspend-host>/receive_device_energy.php"
    method: POST
    headers:
      Authorization: !secret sparkspend_bearer     # "Bearer <VEHICLE_API_KEY>", as for the other two
      Content-Type: application/json
    payload: "{{ payload }}"
    content_type: "application/json"
    timeout: 20

# 1b. configuration.yaml - daily meters for the Zigbee plugs (they only have a running total, no
#    "yesterday" counter like the Tasmota shed meter). A daily utility_meter keeps the finished day in the
#    attribute last_period, which the automation reads just after midnight:
#
utility_meter:
  daglig_fryser:
    source: sensor.0xa4c138558a81b8de_energy
    cycle: daily
  daglig_tv_stue:
    source: sensor.tv_stuen_energy
    cycle: daily
  daglig_kontor_it:
    source: sensor.0x54ef4410011a1120_energy
    cycle: daily
#
#    (They count from the restart that loads them, so the first full day is the day after.)
