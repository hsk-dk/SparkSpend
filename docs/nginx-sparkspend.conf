# nginx: the SparkSpend server block on the web server (the one with `root /var/www/monta`).
# Replaces the old block that only had `location / { try_files ... }` and a generic `location ~ \.php$`.
#
# WHY: the app is deployed as a git checkout straight into the web root. With the old block nginx hands out
# every file in it to anyone who can reach this server's address (the login proxy in front does not help
# against requests that go straight here): .env (API keys, MySQL and Monta credentials), .git, data/*.db,
# cron/*.log, the source - and it RUNS any .php file it is asked for (includes/*.php, routes/*.php,
# cron/*.php, migrate.php).
#
# This block serves only: the pages and API, the machine endpoints, the front end's own scripts/styles,
# the images, manifest.json and robots.txt. Everything else is a 404.
#
# DEPLOY: copy this over the server block in /etc/nginx/sites-available/<your file>, then
#     sudo nginx -t && sudo systemctl reload nginx
# and, from another machine on the network, check it:
#     php doctor.php --probe=http://10.0.1.3 --host=sparkspend.useful.dk
# Every secret path must be reported as refused.
#
# Tested against nginx (stable) + php-fpm 8.4 in containers with the Debian fastcgi snippet; the unix socket
# and `snippets/fastcgi-php.conf` below are from the production block.
#
# Order matters for the regex locations (the first match wins) - keep it. `^~` prefix locations stop the
# regex search, so they are used only where no regex rule should apply (images/).

server {
        listen 80;
        listen [::]:80;

        listen 443;
        listen [::]:443;

        access_log /var/log/nginx/monta_access.log;
        error_log /var/log/nginx/monta_error.log;

        root /var/www/monta;
        index index.php;

        server_name sparkspend.useful.dk;

        # 1. Dotfiles are never served (.env, .env.dev, .git/, .gitignore, .claude/, .github/).
        location ~ /\. { return 404; }

        # 2. Directories that are not web content at all (databases, logs, config, source, tests, docs).
        location ~ ^/(?:data|data-dev|cron|config|migrations|routes|dev|docs)(?:/|$) { return 404; }

        # 3. includes/ holds PHP classes AND the front end's scripts and styles: serve only the assets.
        location ~ ^/includes/(?:elbil/)?[A-Za-z0-9_.-]+\.(?:js|css|svg)$ {
                try_files $uri =404;
        }
        location ~ ^/includes/ { return 404; }

        # 4. Files in the web root that are not part of the site (README.md, CHANGELOG.md, BACKLOG.md, *.sh,
        #    *.db, *.log, .env.example ...). The two real ones come first, as exact matches.
        location = /manifest.json { try_files $uri =404; }
        location = /robots.txt    { try_files $uri =404; }
        location ~ ^/[^/]+\.(?:md|sh|db|log|yml|yaml|example|dev|json|txt)$ { return 404; }

        # 5. Pictures.
        location ^~ /images/ { try_files $uri =404; }

        # 6. The front page.
        location = / { index index.php; }

        # 7. PHP: only the entry points run.
        #    Pages and API: behind the login proxy, and with TRUSTED_PROXIES in .env the app itself refuses
        #    everyone but the proxy.
        location ~ ^/(?:index|api|sw\.js)\.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        }
        #    Machine endpoints: Home Assistant and the uptime monitor call these and authenticate with a
        #    Bearer key. In Authentik (the provider's unauthenticated paths) exclude exactly:
        #        ^/(receive_charger_event|receive_vehicle_data|receive_device_energy|health)\.php$
        location ~ ^/(?:receive_charger_event|receive_vehicle_data|receive_device_energy|health)\.php$ {
                include snippets/fastcgi-php.conf;
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        }
        #    Every other .php file (includes/, routes/, cron/, migrate.php, doctor.php ...) is a 404.
        location ~ \.php$ { return 404; }

        # 8. Anything else: not found.
        location / { return 404; }
}
