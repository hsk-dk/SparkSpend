# nginx: what the SparkSpend server block must (and must not) serve.
#
# WHY: the app is deployed as a git checkout straight into the web root. Without rules like these nginx
# hands out every file in it to anyone who can reach the server's address: .env (API keys, MySQL and Monta
# credentials), .git, data/*.db (the databases), cron/*.log, the source, and it RUNS any .php file it is
# asked for (including includes/*.php, routes/*.php and cron/*.php). The login proxy in front (Authentik)
# does not help against requests that go straight to this server.
#
# HOW: put these locations inside the existing server { } block for the app, replacing the generic
# "location ~ \.php$" handler. Adapt: the PHP-FPM socket, the root, and keep whatever you already have for
# TLS/proxy headers. Test the result with `nginx -t`, reload, then run, from a machine on the network:
#
#     php doctor.php --probe=http://<this-server-ip> --host=<the app's host name>
#
# which fetches .env, .git, the databases etc. and must report them all as refused.
#
# Written from the repository layout, not tested against your nginx: `nginx -t` and the probe are the test.

    root /var/www/monta;
    index index.php;

    # 1. Dotfiles are never served (.env, .env.dev, .git/, .gitignore, .claude/, .github/).
    location ~ /\. { return 404; }

    # 2. Directories that are not web content at all.
    location ~ ^/(?:data|data-dev|cron|config|migrations|routes|dev|docs)(?:/|$) { return 404; }

    # 3. includes/ holds PHP classes AND the front end's scripts and styles: serve only the assets.
    location ~ ^/includes/(?:elbil/)?[A-Za-z0-9_.-]+\.(?:js|css|svg)$ {
        try_files $uri =404;
        expires 1h;
    }
    location ^~ /includes/ { return 404; }

    # 4. Files in the web root that are not part of the site (README.md, CHANGELOG.md, BACKLOG.md, *.sh,
    #    *.db, *.log, .env.example ...). The two real ones are allowed by the exact matches below.
    location = /manifest.json { try_files $uri =404; }
    location = /robots.txt    { try_files $uri =404; }
    location ~ ^/[^/]+\.(?:md|sh|db|log|yml|yaml|example|dev|json|txt)$ { return 404; }

    # 5. Pictures.
    location ^~ /images/ { try_files $uri =404; expires 7d; }

    # 6. PHP: only the entry points run. Everything else that ends in .php is a 404, not an execution.
    #
    #    Pages and API. Behind the login proxy (Authentik) and, with TRUSTED_PROXIES in .env, refused by the
    #    app itself for anyone but the proxy.
    location ~ ^/(?:index|api|sw\.js)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;          # <- your PHP-FPM
    }
    #    Machine endpoints: Home Assistant and the uptime monitor call these directly and authenticate with
    #    a Bearer key. Exclude exactly these in the Authentik proxy:
    #        ^/(receive_charger_event|receive_vehicle_data|receive_device_energy|health)\.php$
    location ~ ^/(?:receive_charger_event|receive_vehicle_data|receive_device_energy|health)\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;          # <- your PHP-FPM
    }
    location ~ \.php$ { return 404; }

    # The front page.
    location = / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;          # <- your PHP-FPM
    }

    # Anything else: not found.
    location / { return 404; }
